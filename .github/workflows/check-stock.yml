name: check-stock
on:
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:
jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - name: Trigger iPhone Duo Finder stock check
        run: curl -fsS --max-time 300 -H "Authorization: Bearer ${{ secrets.CRON_SECRET }}" https://iphone-duo-alerts.vercel.app/api/cron/check-stock -o /dev/null -w "%{http_code}\n"
